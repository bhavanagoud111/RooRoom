User nobody
Group nobody
Port 8888
Listen 0.0.0.0
Timeout 120
LogLevel Connect
MaxClients 50
# Only private Docker addresses may use the proxy.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
# HTTPS, plus 465 for sending sign-in codes through Gmail (smtp.gmail.com, encrypted).
ConnectPort 443
ConnectPort 465
# Deny everything that is not on the allowlist.
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterDefaultDeny Yes
FilterURLs Off
